<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Button Loading State Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1b3d;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            border-radius: 9999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: opacity 0.2s;
            text-decoration: none;
        }
        .button:hover:not(:disabled) {
            opacity: 0.9;
        }
        .button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        .spinner.visible {
            display: inline-block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            margin-bottom: 1rem;
        }
        p {
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.7);
        }
        .info {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GitHub Button Loading State Test</h1>
        <p>This demonstrates the "Connect GitHub repository" button loading behavior</p>
        
        <button id="testButton" class="button" onclick="handleClick(event)">
            <span class="spinner" id="spinner"></span>
            <span id="buttonLabel">Connect GitHub repository</span>
        </button>
        
        <div class="info">
            <strong>Expected behavior:</strong><br>
            When clicked, the button should show a spinning icon and change text to "Redirecting to GitHub" 
            before navigation occurs. The button becomes disabled during loading.
        </div>
    </div>
    
    <script>
        let isNavigating = false;
        
        function handleClick(event) {
            if (isNavigating) return;
            
            event.preventDefault();
            isNavigating = true;
            
            const button = document.getElementById('testButton');
            const spinner = document.getElementById('spinner');
            const label = document.getElementById('buttonLabel');
            
            // Show loading state
            button.disabled = true;
            button.setAttribute('aria-busy', 'true');
            spinner.classList.add('visible');
            label.textContent = 'Redirecting to GitHub';
            
            // Simulate navigation after 2 seconds (so we can see the loading state)
            setTimeout(() => {
                console.log('Would navigate to: /api/github/install');
                // In real app: window.location.href = '/api/github/install';
                
                // For demo, reset after showing loading state
                setTimeout(() => {
                    isNavigating = false;
                    button.disabled = false;
                    button.removeAttribute('aria-busy');
                    spinner.classList.remove('visible');
                    label.textContent = 'Connect GitHub repository';
                }, 1000);
            }, 2000);
        }
    </script>
</body>
</html>
